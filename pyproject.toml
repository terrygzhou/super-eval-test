[project]
name = "super-eval-test"
version = "0.1.0"
description = "AI-driven web app E2E testing: source-aware data generation, browser automation, server log correlation"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "openai>=1.60",
    "rich>=13.9",
    "typer>=0.15",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
superApp = "src.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
[tool.pytest.ini_options]
filterwarnings = [
    # TestStepResult / TestRunResult are dataclasses imported into test modules;
    # pytest shouldn't try to collect them as test classes.
    "ignore::pytest.PytestCollectionWarning",
    # Benign Playwright subprocess __del__ after asyncio.run closes the loop
    # (CPython issue 40674). The gate/run commands drain it via gc.collect().
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
