# SuperApp Test Configuration

# LLM endpoint for test data generation
llm:
  base_url: "http://localhost:8080"
  model: "Qwen3.6-27B"
  api_key: "not-needed"  # local LLM

# Target web application
target:
  url: "http://localhost:8081"
  # Paths to scan for forms/inputs
  scan_paths:
    - "/"
    - "/login"
    - "/register"

# Source code analysis
source:
  # Path to target web app source code (required — no default; use --source or set this)
  root: "/path/to/your/webapp/source"
  # File patterns to scan for form schemas
  form_patterns:
    - "**/forms.py"
    - "**/schemas.py"
    - "**/models.py"
    - "**/validators.py"
    - "**/*_form.py"
    - "**/schema*.py"
  # Route patterns to find form endpoints
  route_patterns:
    - "**/routes.py"
    - "**/api.py"
    - "**/endpoints.py"

# Server log monitoring
logs:
  # How to access server logs
  type: "docker"  # docker | file | journalctl
  docker_container: "loop_factory_web"
  # Or: log_file: "/path/to/server.log"
  # Or: journal_unit: "webapp.service"
  # Keywords that indicate errors
  error_patterns:
    - "ERROR"
    - "Exception"
    - "Traceback"
    - "500"
    - "Connection refused"

# Playwright settings
# OpenHands Agent Server (agent mode)
openhands:
  # Where the agent server is. Default http://localhost:3005 (SuperApp's own compose container).
  # To reuse a running one, e.g. the openhands-canvas container:
  #   url: "http://localhost:43006"
  #   use_existing_server: true
  #   auth_token: "your-openhands-api-key"   # sent as Authorization: Bearer <token>
  # url: "http://localhost:3005"
  # use_existing_server: false
  # auth_token: ""

browser:
  headless: true
  timeout_ms: 30000
  viewport:
    width: 1280
    height: 720
  # Auth tokens or cookies to pre-load
  storage_state: null

# Pipeline settings
pipeline:
  # Number of test data variations per form
  data_variations: 3
  # Max concurrent browser pages
  max_pages: 3
  # Save artifacts
  artifacts_dir: "./artifacts"


# Evaluation gate (superApp gate)
# Judge: optional LLM grader. When this block is absent, the gate uses the
# deterministic ScriptedGrader only (zero LLM calls).
# judge:
#   base_url: "http://localhost:8080"
#   model: "Qwen3.6-27B"
#   api_key: "not-needed"
#   rubric: "Pass only if the form submission completed and the confirmation
#            screen is visible. Fail on any error banner or empty validation."

# Cost tracking: rate table for estimated cost (USD) per gate run.
# Defaults are 0.0 = instrumented, not priced. Set values to produce a $ figure.
cost:
  rate_table:
    per_1k_input_usd: 0.0
    per_1k_output_usd: 0.0
